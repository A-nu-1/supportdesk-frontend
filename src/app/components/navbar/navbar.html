<header class="border-b border-slate-800 bg-slate-950 text-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-4">
    <div class="flex items-center gap-8">
      <a routerLink="/tickets" class="text-lg font-bold"> SupportDesk </a>

      <a routerLink="/tickets" class="text-sm text-slate-300 hover:text-white"> Tickets </a>
      @if (auth.isRealAdmin()) {
        <a routerLink="/admin" class="text-sm text-slate-300 hover:text-white"> Admin </a>
      }
    </div>

    @if (auth.currentUser(); as user) {
      <div class="flex items-center gap-5">
        <div class="text-right">
          <p class="text-sm font-semibold">
            {{ user.firstName }}
            {{ user.lastName }}
          </p>

          <p class="text-xs font-semibold tracking-wide text-blue-400">
            {{ user.role }}
          </p>
        </div>

        <button
          type="button"
          (click)="logout()"
          class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-semibold hover:bg-slate-800"
        >
          Logout
        </button>
      </div>
    }
  </div>
</header>
